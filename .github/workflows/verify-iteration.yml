name: Verify OneSpace iteration (no APK or release)

on:
  # Manual only (26 Nov 2026): the R12/R13 validation markers are historical.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onespace-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Verify committed dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
