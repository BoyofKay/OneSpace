name: Verify OneSpace iteration (no APK or release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/R12_READY_FOR_TESTS.md'
      - 'validation/R13_VERIFY.md'

permissions:
  contents: read

concurrency:
  group: onespace-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Verify committed dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
