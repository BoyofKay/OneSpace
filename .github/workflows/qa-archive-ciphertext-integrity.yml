name: QA archive ciphertext integrity (no APK)
on:
  push:
    branches:
      - main
      - qa-archive-content-integrity-0177-20261120
      - qa-archive-encryption-envelope-0178-20261120
      - qa-encrypted-preview-staging-0179-20261120
      - qa-private-restore-dry-run-0195-20261120
      - qa-encrypted-vault-subset-manifest-0209-20261120
      - qa-subset-storage-roundtrip-0210-20261120
    paths:
      - 'supabase/functions/onespace-download-archive/index.ts'
      - 'supabase/tests/archive_download_integrity.test.mjs'
      - 'supabase/tests/archive_envelope_crypto.test.mjs'
      - 'supabase/functions/_shared/structured_archive_crypto.mjs'
      - 'supabase/functions/onespace-qa-structured-preview/index.ts'
      - 'supabase/tests/qa_archive_staging_handler.test.mjs'
      - 'supabase/functions/onespace-archive-janitor/index.ts'
      - 'supabase/tests/qa_preview_janitor_handler.test.mjs'
      - 'supabase/tests/qa_private_restore_dry_run.test.mjs'
      - 'supabase/functions/_shared/qa_private_restore_dry_run.mjs'
      - 'supabase/functions/_shared/qa_osa_subset_restore_plan.mjs'
      - 'supabase/tests/qa_osa_subset_restore_plan.test.mjs'
      - 'supabase/functions/_shared/qa_vault_subset_osa.mjs'
      - 'supabase/tests/qa_vault_subset_osa.test.mjs'
      - 'supabase/scripts/qa_private_vault_subset_export.mjs'
      - 'supabase/tests/qa_private_vault_subset_export.test.mjs'
      - 'supabase/functions/onespace-qa-subset-file/index.ts'
      - 'supabase/tests/qa_subset_storage_roundtrip_0211.test.mjs'
      - '.github/workflows/qa-archive-ciphertext-integrity.yml'
  pull_request:
    paths:
      - 'supabase/functions/onespace-download-archive/index.ts'
      - 'supabase/tests/archive_download_integrity.test.mjs'
      - 'supabase/tests/archive_envelope_crypto.test.mjs'
      - 'supabase/functions/_shared/structured_archive_crypto.mjs'
      - 'supabase/functions/onespace-qa-structured-preview/index.ts'
      - 'supabase/tests/qa_archive_staging_handler.test.mjs'
      - 'supabase/functions/onespace-archive-janitor/index.ts'
      - 'supabase/tests/qa_preview_janitor_handler.test.mjs'
      - 'supabase/tests/qa_private_restore_dry_run.test.mjs'
      - 'supabase/functions/_shared/qa_private_restore_dry_run.mjs'
      - 'supabase/functions/_shared/qa_osa_subset_restore_plan.mjs'
      - 'supabase/tests/qa_osa_subset_restore_plan.test.mjs'
      - 'supabase/functions/_shared/qa_vault_subset_osa.mjs'
      - 'supabase/tests/qa_vault_subset_osa.test.mjs'
      - 'supabase/scripts/qa_private_vault_subset_export.mjs'
      - 'supabase/tests/qa_private_vault_subset_export.test.mjs'
      - 'supabase/functions/onespace-qa-subset-file/index.ts'
      - 'supabase/tests/qa_subset_storage_roundtrip_0211.test.mjs'
      - '.github/workflows/qa-archive-ciphertext-integrity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mock Auth, archive registry and Storage; verify actual ciphertext
        run: node --experimental-strip-types --test supabase/tests/qa_subset_storage_roundtrip_0211.test.mjs supabase/tests/qa_private_vault_subset_export.test.mjs supabase/tests/qa_vault_subset_osa.test.mjs supabase/tests/archive_download_integrity.test.mjs supabase/tests/archive_envelope_crypto.test.mjs supabase/tests/qa_archive_staging_handler.test.mjs supabase/tests/qa_preview_janitor_handler.test.mjs supabase/tests/qa_private_restore_dry_run.test.mjs supabase/tests/qa_osa_subset_restore_plan.test.mjs
