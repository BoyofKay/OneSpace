name: QA shared-media purge contract (no APK)
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/qa_shared_media_purge_contract.mjs'
      - 'supabase/functions/_shared/qa_shared_media_purge_contract.test.mjs'
      - 'supabase/functions/onespace-qa-shared-media-purge/**'
      - 'supabase/functions/_shared/qa_account_private_media_purge_contract.mjs'
      - 'supabase/functions/_shared/qa_account_private_media_purge_contract.test.mjs'
      - 'supabase/functions/onespace-qa-account-private-media-purge/**'
      - '.github/workflows/qa-shared-media-purge-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-media-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify personal Storage buckets are excluded and paths remain owner-scoped
        run: node --test supabase/functions/_shared/qa_shared_media_purge_contract.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify account-owned files cannot cross into shared Storage deletion
        run: node --test supabase/functions/_shared/qa_account_private_media_purge_contract.test.mjs
      - name: Type-check BOTH staged service-only Edge workers without deployment
        run: |
          deno check supabase/functions/onespace-qa-shared-media-purge/index.ts
          deno check supabase/functions/onespace-qa-account-private-media-purge/index.ts
