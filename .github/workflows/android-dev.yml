name: Build and publish OneSpace QA APK

# Regular development commits do NOT start APK builds.
# A finalized iteration updates release/READY_TO_BUILD.md exactly once.
# It can also be started manually from GitHub Actions if needed.
on:
  workflow_dispatch:
  push:
    branches: [main, 'qa/lifecycle-first-slice-20261119', 'qa/recover-release461-full-source-20261119']
    paths:
      - 'release/READY_TO_BUILD.md'

permissions:
  contents: write

# Never cancel a final release just because another commit arrives.
concurrency:
  group: android-qa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify recovered QA feature baseline
        shell: bash
        run: |
          set -euo pipefail
          # Prevent another signed QA release from an older/diverged source.
          # Keep the recovery baseline commit in the checked-out history.
          BASELINE=aa4cbc86056b5253b51e63e7dea59e4473046304
          git cat-file -e "$BASELINE^{commit}"
          git merge-base --is-ancestor "$BASELINE" HEAD || {
            echo "::error::QA release source does not contain verified Release 461 features."
            exit 1
          }
          test -s lib/features/spaces/my_space_screen.dart
          test -s lib/features/spaces/invite_partner_screen.dart
          test -s lib/features/spaces/my_archives_screen.dart
          test -s lib/features/profile/change_password_screen.dart
          test -s lib/features/spaces/space_lifecycle_policy.dart
          echo "Recovered QA feature baseline verified."
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Flutter's included Gradle plugin build may resolve Kotlin artifacts
      # through pluginPortal alone. Maven Central hosts these POMs, so give
      # every included Gradle build an explicit Maven Central fallback.
      - name: Configure Gradle Maven Central fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/onespace-repositories.init.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              google()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve exact committed Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify lockfile has not changed
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          echo 'Dependency lockfile is committed and reproducible.'
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore stable preview-only debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode tools/dev-signing/onespace-preview.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "7bb8494a49f9e6f91e8b81a2aa8f528868af050b8543cd4f016bfa1db135bac3  $HOME/.android/debug.keystore" | sha256sum -c -
          chmod 600 "$HOME/.android/debug.keystore"
      # Firebase registration is optional during development. An actual
      # Firebase Android app config enables native FCM resources at build time.
      # Never echo the encoded file in logs or commit service credentials.
      - name: Apply OneSpace Firebase Android configuration if provided
        shell: bash
        env:
          ONESPACE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ONESPACE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ONESPACE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$ONESPACE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python3 - <<'PY'
          import json
          with open('android/app/google-services.json') as f:
              payload=json.load(f)
          clients=payload.get('client', [])
          import os
          if not any(
              entry.get('client_info', {}).get('android_client_info', {}).get('package_name')
              == 'onespace.qa'
              for entry in clients
          ):
              # Until onespace.qa is added to the Firebase project, build without push.
              os.remove('android/app/google-services.json')
              print('::warning::Firebase config has no onespace.qa app yet: this QA build has in-app notifications only. Add an Android app "onespace.qa" in Firebase and update ONESPACE_GOOGLE_SERVICES_JSON_BASE64.')
          else:
              print('OneSpace Firebase Android QA registration validated.')
          PY
          else
            if grep -q '^# R25 — Configured Firebase Android Preview' release/READY_TO_BUILD.md || grep -q '^Require-Firebase-Config: true$' release/READY_TO_BUILD.md; then
              echo "::error::OneSpace configured Firebase release requires ONESPACE_GOOGLE_SERVICES_JSON_BASE64. Confirm its exact GitHub Actions repository secret name."
              exit 1
            fi
            echo 'No Firebase Android config yet: build continues with in-app notifications only.'
          fi
      - name: Build installable QA APK (QA backend)
        run: flutter build apk --release --flavor qa --dart-define=ONESPACE_ENV=qa --dart-define=ONESPACE_VERSION=0.1.${{ github.run_number }}-qa --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=ONESPACE_VERSION=0.1.${{ github.run_number }}
      - name: Verify signed APK uses the OneSpace test certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-qa-release.apk | tee /tmp/onespace-signature.txt
          # Fail closed if signing unexpectedly changes; QA updates need this exact key.
          grep -qi "90375bb8d7dbd6527cca17f626da149534eaffe10076c38a5c69ac86a3aac043" /tmp/onespace-signature.txt
      - name: Verify QA package ID
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-qa-release.apk | tee /tmp/onespace-package.txt
          grep -q "package: name='onespace.qa'" /tmp/onespace-package.txt
          grep -q "application-label:'OneSpace QA'" /tmp/onespace-package.txt
      - name: Name downloadable APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-qa-release.apk "OneSpace-QA-0.1.${{ github.run_number }}.apk"
      # Preserve the verified signed package even if GitHub Releases denies
      # a write or has a temporary API failure. This is independently downloadable
      # and can be republished without recompiling via rerunning only publish.
      - name: Store verified APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneSpace-QA-0.1.${{ github.run_number }}
          path: OneSpace-QA-0.1.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: OneSpace-QA-0.1.${{ github.run_number }}
      - name: Publish signed APK to GitHub Releases when permitted
        id: publish
        env:
          GH_TOKEN: ${{ secrets.ONESPACE_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="qa-0.1.${{ github.run_number }}"
          ASSET="OneSpace-QA-0.1.${{ github.run_number }}.apk"
          test -s "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release upload "$TAG" "$ASSET" --clobber; then
              echo "published_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if gh release create "$TAG" "$ASSET" \
              --title "OneSpace QA 0.1.${{ github.run_number }}" \
              --notes "OneSpace QA (package onespace.qa) on the QA backend — test data only, not for real couples. Installs next to the real OneSpace app." \
              --prerelease --target "${{ github.sha }}"; then
              echo "published_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "published_release=false" >> "$GITHUB_OUTPUT"
          # An API 403 is an authorization issue, not a transient build error.
          # The verified, signed APK remains downloadable in this run's Artifacts.
          echo "::warning::GitHub Releases did not accept this token. The signed APK remains available from the build job's retained Artifacts. No retry loop is started."
      - name: Confirm publicly listed release asset
        if: steps.publish.outputs.published_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.ONESPACE_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="qa-0.1.${{ github.run_number }}"
          ASSET="OneSpace-QA-0.1.${{ github.run_number }}.apk"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          gh release view "$TAG" --json url --jq '.url'
