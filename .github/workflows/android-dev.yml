name: Build and publish OneSpace APK

# Regular development commits do NOT start APK builds.
# A finalized iteration updates release/READY_TO_BUILD.md exactly once.
# It can also be started manually from GitHub Actions if needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/READY_TO_BUILD.md'

permissions:
  contents: write

# Never cancel a final release just because another commit arrives.
concurrency:
  group: android-preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Flutter's included Gradle plugin build may resolve Kotlin artifacts
      # through pluginPortal alone. Maven Central hosts these POMs, so give
      # every included Gradle build an explicit Maven Central fallback.
      - name: Configure Gradle Maven Central fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/onespace-repositories.init.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              google()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve exact committed Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify lockfile has not changed
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          echo 'Dependency lockfile is committed and reproducible.'
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore stable preview-only debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode tools/dev-signing/onespace-preview.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "7bb8494a49f9e6f91e8b81a2aa8f528868af050b8543cd4f016bfa1db135bac3  $HOME/.android/debug.keystore" | sha256sum -c -
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build optimized installable preview APK
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify signed APK uses OneSpace preview certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/onespace-signature.txt
          # Fail closed if signing unexpectedly changes; existing previews need this exact key.
          grep -qi "90375bb8d7dbd6527cca17f626da149534eaffe10076c38a5c69ac86a3aac043" /tmp/onespace-signature.txt
      - name: Verify preview package ID is unchanged
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | tee /tmp/onespace-package.txt
          grep -q "package: name='com.onespace.onespace.preview'" /tmp/onespace-package.txt
      - name: Name downloadable APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "OneSpace-preview-0.1.${{ github.run_number }}.apk"
      # Preserve the verified signed package even if GitHub Releases denies
      # a write or has a temporary API failure. This is independently downloadable
      # and can be republished without recompiling via rerunning only publish.
      - name: Store verified APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneSpace-preview-0.1.${{ github.run_number }}
          path: OneSpace-preview-0.1.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: OneSpace-preview-0.1.${{ github.run_number }}
      - name: Publish signed APK to GitHub Releases (retryable)
        env:
          # Optional fine-grained repository release token if integration
          # permissions prevent GITHUB_TOKEN from creating releases.
          GH_TOKEN: ${{ secrets.ONESPACE_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="preview-0.1.${{ github.run_number }}"
          ASSET="OneSpace-preview-0.1.${{ github.run_number }}.apk"
          test -s "$ASSET"
          published=false
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$ASSET" --clobber; then
                published=true
                break
              fi
            else
              if gh release create "$TAG" "$ASSET" \
                --title "OneSpace Preview 0.1.${{ github.run_number }}" \
                --notes "Signed Android test preview, not a production release. OneSpace uses a stable preview-only signing key and an unchanged application ID. Verify functionality on both partners' phones before production use." \
                --prerelease --target "${{ github.sha }}"; then
                published=true
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if [ "$published" != true ]; then
            echo "::error::GitHub Release publication failed; signed APK is retained under this workflow's Artifacts."
            exit 1
          fi
      - name: Confirm publicly listed release asset
        env:
          GH_TOKEN: ${{ secrets.ONESPACE_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="preview-0.1.${{ github.run_number }}"
          ASSET="OneSpace-preview-0.1.${{ github.run_number }}.apk"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          gh release view "$TAG" --json url --jq '.url'
