name: Build and publish OneSpace APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Restore stable preview-only debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode tools/dev-signing/onespace-preview.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "7bb8494a49f9e6f91e8b81a2aa8f528868af050b8543cd4f016bfa1db135bac3  $HOME/.android/debug.keystore" | sha256sum -c -
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build installable preview APK
        run: flutter build apk --debug --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify signed APK uses OneSpace preview certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/onespace-signature.txt
          # Fail closed if signing unexpectedly changes; existing previews need this exact key.
          grep -qi "90375bb8d7dbd6527cca17f626da149534eaffe10076c38a5c69ac86a3aac043" /tmp/onespace-signature.txt
      - name: Name downloadable APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "OneSpace-preview-0.1.${{ github.run_number }}.apk"
      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "preview-0.1.${{ github.run_number }}" "OneSpace-preview-0.1.${{ github.run_number }}.apk" \
            --title "OneSpace Preview 0.1.${{ github.run_number }}" \
            --notes "Development preview (not a production release). Download the APK file directly. Android debug signing keys may differ between runs, so updating an already installed preview may require uninstalling the earlier preview, which removes its local data. Stable release signing is planned before real customer use." \
            --prerelease --target "${{ github.sha }}"
