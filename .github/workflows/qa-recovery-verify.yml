name: Verify QA release recovery (no APK)

on:
  push:
    branches:
      - qa/recover-release461-full-source-20261119
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out recovered source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert recovered R461 baseline
        shell: bash
        run: |
          set -euo pipefail
          # Verify known-good R461 feature blobs, regardless of Git ancestry.
          check_blob() {
            local actual
            actual="$(git rev-parse "HEAD:$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::Recovered QA feature differs unexpectedly: $1"
              exit 1
            fi
          }
          check_blob lib/features/spaces/invite_partner_screen.dart 2b7613fd3098168b7d61f43d878c8afcb8ba6bf9
          check_blob lib/features/spaces/my_archives_screen.dart e6782a67496af0a65e25d1c43d8defee8b2dfd78
          check_blob lib/features/spaces/space_lifecycle_policy.dart cf7f89592253455ba375386b4aa07aa2febcde86
          check_blob lib/features/profile/password_change_rules.dart 8706afe0852d9ae2c52f36efe7e76d1eac74a1be
          check_blob supabase/schema/0146_qa_personal_vault_shadow_migration.sql 6c359feb49fb6253eafee5f78834e287e9828cb2
          test -f lib/features/spaces/my_space_screen.dart
          test -f lib/features/spaces/invite_partner_screen.dart
          test -f lib/features/spaces/my_archives_screen.dart
          test -f lib/features/profile/change_password_screen.dart
          test -f test/auth_recovery_widget_test.dart
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
