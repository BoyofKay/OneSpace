name: Verify QA release recovery (no APK)

on:
  push:
    branches:
      - qa/recover-release461-full-source-20261119
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Verification only: discard obsolete commit checks, but never cancel a
# signed QA APK build. The Android release workflow has a separate group.
concurrency:
  group: onespace-qa-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out recovered source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert recovered R461 baseline
        shell: bash
        run: |
          set -euo pipefail
          # PR #72 merged the verified QA recovery into main. Every future QA
          # build must descend from that exact integration commit. Do NOT pin
          # feature blob hashes: that would block legitimate future fixes.
          BASELINE=81a03000de949e99f258fdbd81402255569d1ea5
          git merge-base --is-ancestor "$BASELINE" HEAD || {
            echo "::error::QA release source is missing the recovered feature baseline."
            exit 1
          }
          test -f lib/features/spaces/my_space_screen.dart
          test -f lib/features/spaces/invite_partner_screen.dart
          test ! -e lib/features/spaces/my_archives_screen.dart
          test -s docs/ADR_2026-11-20_PERSONAL_SHARED_OWNERSHIP_AND_DELETION.md
          test -f lib/features/profile/change_password_screen.dart
          test -f test/auth_recovery_widget_test.dart
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
