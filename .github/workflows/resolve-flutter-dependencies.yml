name: Resolve reviewed Flutter Quill dependency

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml

permissions:
  contents: write

concurrency:
  group: onespace-dependency-resolution
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve Flutter packages and lock exact versions
        run: flutter pub get
      - name: Commit only the resolved dependency lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'Lock Flutter Quill dependency graph for OneSpace Notes 2.0'
          # Flutter also updates generated plugin files. The committed lock
          # is the only output this workflow is allowed to retain.
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
