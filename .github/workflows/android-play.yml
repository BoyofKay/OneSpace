name: Build OneSpace for Google Play

# Production app (package live.onespace.app, production backend), built as an
# Android App Bundle (.aab) signed with the Play upload key. Started by hand only.
# Upload the .aab from this run's Artifacts to Play Console (closed testing first).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version people see in the store, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      allow_without_push:
        description: 'Build even if Firebase has no live.onespace.app app yet (no push notifications)'
        type: boolean
        default: false
      test_only:
        description: 'Check that the production app builds, without the upload key (result is NOT for Play)'
        type: boolean
        default: false
  # Explicit marker file is the sole push trigger: build/upload AAB only, never deploy to Play.
  push:
    branches: [main]
    paths:
      - 'release/PRODUCTION_READY_TO_BUILD.md'

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Refuse to build without the production backend address
        shell: bash
        run: |
          if grep -q 'PROD_URL_PENDING\|PROD_KEY_PENDING' lib/core/app_env.dart; then
            echo "::error::lib/core/app_env.dart still has placeholder production backend values."
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle Maven Central fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/onespace-repositories.init.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              google()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve exact committed Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore the Play upload key
        if: ${{ !inputs.test_only }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ONESPACE_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ONESPACE_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONESPACE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONESPACE_UPLOAD_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret for the Play upload key ($v). See docs/RELEASE_ENVIRONMENTS.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
          {
            echo "ONESPACE_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "ONESPACE_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ONESPACE_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ONESPACE_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Apply Firebase configuration for live.onespace.app
        shell: bash
        env:
          ONESPACE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ONESPACE_GOOGLE_SERVICES_JSON_BASE64 }}
          ALLOW_WITHOUT_PUSH: ${{ inputs.allow_without_push || inputs.test_only }}
        run: |
          ok=false
          if [ -n "$ONESPACE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$ONESPACE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            if python3 -c "import json,sys; c=json.load(open('android/app/google-services.json')).get('client',[]); sys.exit(0 if any(e.get('client_info',{}).get('android_client_info',{}).get('package_name')=='live.onespace.app' for e in c) else 1)"; then
              ok=true
            else
              rm android/app/google-services.json
            fi
          fi
          if [ "$ok" = true ]; then
            echo 'Firebase app live.onespace.app found: push notifications enabled.'
          elif [ "$ALLOW_WITHOUT_PUSH" = true ]; then
            echo '::warning::Building WITHOUT push notifications (Firebase has no live.onespace.app app yet).'
          else
            echo "::error::Firebase has no Android app 'live.onespace.app' in ONESPACE_GOOGLE_SERVICES_JSON_BASE64. Add it in Firebase, update the secret, or re-run with 'allow_without_push'."
            exit 1
          fi
      - name: Build the production App Bundle
        run: >
          flutter build appbundle --release --flavor prod
          --dart-define=ONESPACE_ENV=production
          --build-name=${{ inputs.version_name || '1.0.0' }}
          --build-number=${{ github.run_number }}
          --dart-define=ONESPACE_VERSION=${{ inputs.version_name || '1.0.0' }}
      - name: Verify package, signature and backend
        shell: bash
        env:
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          test -s "$AAB"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > /tmp/manifest.pb
          grep -a -q 'live.onespace.app' /tmp/manifest.pb
          if [ "$TEST_ONLY" = true ]; then
            echo 'Test build: production package and backend compiled. NOT signed for Play.'
            cp "$AAB" "TEST-NOT-FOR-PLAY-OneSpace-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}.aab"
            exit 0
          fi
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          # The upload key, never the public test key.
          if grep -qi '90:37:5B:B8:D7:DB:D6:52' /tmp/cert.txt; then
            echo '::error::Bundle is signed with the test key, not the Play upload key.'
            exit 1
          fi
          cp "$AAB" "OneSpace-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}.aab"
      - name: Keep the bundle for upload to Play Console
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test_only && 'TEST-NOT-FOR-PLAY-' || '' }}OneSpace-Play-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}
          path: ${{ inputs.test_only && 'TEST-NOT-FOR-PLAY-' || '' }}OneSpace-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 90
