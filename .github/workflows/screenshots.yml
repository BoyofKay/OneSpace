name: App screenshots (demo couple)

# R80: real-app screenshots for the website and the stores. Signs in as the
# fictional demo couple (Omar & Lina) on an Android emulator. Manual only.
on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'Comma-separated sets: core|themes|together - en|ar'
        default: 'core-en,core-ar,together-en,together-ar,themes-en,themes-ar,video-en,video-ar'
        required: true
      demo_password:
        description: 'Only if the DEMO_PASSWORD secret is not set yet'
        required: false

permissions:
  contents: write   # pushes the images to the 'app-screens' branch

concurrency:
  group: onespace-demo-space   # one robot at a time: they share the demo space
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 6G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile || true
          df -h / ; free -h
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle Maven Central fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/onespace-repositories.init.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              google()
              gradlePluginPortal()
            }
          }
          GRADLE
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build the robot app once (before the emulator, to save memory)
        run: |
          flutter build apk --debug -t integration_test/screenshots_test.dart
          (cd android && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          df -h / ; free -h
      - name: Install ffmpeg (tutorial clips)
        run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Demo login
        id: demo
        env:
          FROM_SECRET: ${{ secrets.DEMO_PASSWORD }}
          FROM_INPUT: ${{ inputs.demo_password }}
        run: |
          pw="${FROM_SECRET:-$FROM_INPUT}"
          if [ -z "$pw" ]; then echo "::error::Add the DEMO_PASSWORD secret"; exit 1; fi
          echo "::add-mask::$pw"
          echo "DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Run the robot on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOT_SETS: ${{ inputs.sets }}
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tools/screenshots/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: |
            build/screenshots/
            build/logs/
          retention-days: 14
      - name: Publish to the app-screens branch (read by the website build)
        if: always()
        shell: bash
        run: |
          set -e
          [ -d build/screenshots ] || exit 0
          out=$(mktemp -d); cd "$out"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin app-screens 2>/dev/null; then git checkout -q -B app-screens FETCH_HEAD; else git checkout -q -b app-screens; fi
          for d in screenshots logs videos; do
            if [ -d "$GITHUB_WORKSPACE/build/$d" ]; then mkdir -p "$d"; cp -r "$GITHUB_WORKSPACE/build/$d/." "$d/"; fi
          done
          git add -A
          git commit -q -m "Screens from run ${{ github.run_id }} (${{ inputs.sets }})" || exit 0
          git push -q origin HEAD:app-screens
