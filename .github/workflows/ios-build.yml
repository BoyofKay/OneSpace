name: Build OneSpace iOS QA (unsigned)

# Manual only: macOS runners are expensive in private repositories.
# Unsigned QA is not installable on an iPhone. Signed TestFlight is separate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onespace-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Configure QA identity and callback
        run: python3 tools/ios/configure_env.py qa
      - name: Verify bundle isolation rules
        run: python3 -m unittest discover -s tools/ios -p 'test_*.py'
      - name: Resolve exact dependencies
        run: flutter pub get --enforce-lockfile
      - name: Add optional QA Firebase config and verify its bundle ID
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_QA_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os,plistlib,pathlib
          raw=os.environ.get('FIREBASE_PLIST_BASE64','').strip()
          if not raw:
              print('iOS QA Firebase not configured: only in-app notifications will work')
          else:
              data=base64.b64decode(raw,validate=True)
              config=plistlib.loads(data)
              if config.get('BUNDLE_ID')!='com.onespace.onespace.qa':
                  raise SystemExit('Wrong QA iOS Firebase bundle ID')
              if not config.get('GOOGLE_APP_ID'):
                  raise SystemExit('Missing Firebase application ID')
              pathlib.Path('ios/Runner/GoogleService-Info.plist').write_bytes(data)
              print('Matching QA iOS Firebase config installed')
          PY
      - name: Build iPhone app without signing
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=ONESPACE_ENV=qa \
            --dart-define=ONESPACE_VERSION=ios-qa-${{ github.run_number }}
      - name: Verify final app identity and callback
        run: python3 tools/ios/verify_bundle.py --app build/ios/iphoneos/Runner.app --environment qa
      - name: Package unsigned build
        run: |
          cd build/ios/iphoneos
          zip -qry OneSpace-QA-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: OneSpace-iOS-QA-unsigned-${{ github.run_number }}
          path: build/ios/iphoneos/OneSpace-QA-unsigned.zip
          retention-days: 7
